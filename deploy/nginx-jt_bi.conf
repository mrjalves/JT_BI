# Mapeamento para suporte a WebSockets (SignalR do Blazor Server)
# (Insira este bloco dentro de http { } se ainda não existir globalmente no seu nginx.conf)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name bi.jtsistemas.com.br; # Ajuste para o seu domínio ou subdomínio

    # Redirecionamento HTTP -> HTTPS (descomente após configurar certificados SSL com Certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://127.0.0.1:5020;
        proxy_http_version 1.1;

        # Cabeçalhos essenciais para WebSockets / SignalR
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # Cabeçalhos de repasse de cliente
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts longos para manter conexões interativas do Blazor Server ativas
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Limite de tamanho para upload de arquivos/planilhas de BI
        client_max_body_size 50M;
    }
}

