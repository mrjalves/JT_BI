name: Build e Deploy JT_BI

on:
  push:
    branches: [main, Master]
  workflow_dispatch:

env:
  SERVICE: jt_sistemas_bi
  DEST: /var/www/jt_sistemas_bi
  PORT: 5020

concurrency:
  group: deploy-jt_sistemas_bi
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JT_BI
        uses: actions/checkout@v4

      # Checkout de JT_ApplicationLayer lado a lado para satisfazer as ProjectReferences relativas
      - name: Checkout JT_ApplicationLayer
        uses: actions/checkout@v4
        with:
          repository: mrjalves/JT_ApplicationLayer
          token: ${{ secrets.GH_PAT || secrets.GH_PAT_REPO }}
          path: JT_ApplicationLayer
          ref: Master

      - name: Prepare JT_ApplicationLayer sibling path
        run: |
          rm -rf "$GITHUB_WORKSPACE/../JT_ApplicationLayer"
          mv "$GITHUB_WORKSPACE/JT_ApplicationLayer" "$GITHUB_WORKSPACE/../JT_ApplicationLayer"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar Aplicação (Release)
        run: |
          dotnet publish JT_BI.csproj -c Release -o publish

      # Configurar chave SSH para comunicação com a VPS
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      # Enviar arquivos compilados via rsync
      - name: Enviar arquivos para a VPS
        run: |
          rsync -az --delete \
            --exclude '/appsettings.Production.json' \
            --exclude '/appsettings.Local.json' \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude 'uploads/' \
            --exclude 'logs/' \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            ./publish/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEST }}/

      # Reiniciar o serviço e validar integridade
      - name: Reiniciar serviço e verificar
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'EOF'
          set -e
          sudo systemctl restart ${{ env.SERVICE }}
          sleep 5
          if ! systemctl is-active --quiet ${{ env.SERVICE }}; then
            echo "::error::Serviço não subiu"
            journalctl -u ${{ env.SERVICE }} -n 50 --no-pager
            exit 1
          fi
          echo "Deploy do ${{ env.SERVICE }} concluído com sucesso!"
          EOF
